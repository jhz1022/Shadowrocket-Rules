[General]
# Local module, register disabled until actual node and LAN validation.
# Match configuration: /etc/openclash/config/Mihomo.yaml (full path).
EN_MODE = fake-ip
PROXY_MODE = rule
ENABLE_CUSTOM_DNS = 0
ENABLE_REDIRECT_DNS = 2
ENABLE_RESPECT_RULES = 0
APPEND_WAN_DNS = 0
APPEND_DEFAULT_DNS = 0
CUSTOM_FAKEIP_FILTER = 0
CUSTOM_FALLBACK_FILTER = 0
CUSTOM_NAME_POLICY = 0
CUSTOM_HOST = 0
ENABLE_CUSTOM_CLASH_RULES = 0
ENABLE_RULE_PROXY = 0
CHINA_IP_ROUTE = 0
CHINA_IP6_ROUTE = 0
COMMON_PORTS = 0
DISABLE_UDP_QUIC = 0
ENABLE_UDP_PROXY = 1
IPV6_ENABLE = 0
IPV6_DNS = 0
ROUTER_SELF_PROXY = 0
INTRANET_ALLOWED = 1

[YAML]
# NODE_SUBSCRIPTION_BOOTSTRAP_POLICY
# The reviewed public policy has exactly one selector. Reject remains first
# until the operator explicitly selects an actual node.
proxy-groups:
  - name: PROXY
    type: select
    proxies: [REJECT]
    use: [nodes]

[Overwrite]
# Load the private URL as YAML data, not as an environment-expanded module line.
# If this file is absent the unresolved `use: [nodes]` fails configuration check.
ruby_cover "$CONFIG_FILE" "['proxy-providers']" "/etc/openclash/custom/nodes.private.yaml" "proxy-providers"
